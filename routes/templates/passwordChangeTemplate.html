<!DOCTYPE html>
<html>
  <head>
    <title>Verify Your Email</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          margin: 0;
          padding: 0;
          background-color: #f4f4f4;
        }
        .email-wrapper {
          max-width: 600px;
          margin: 0 auto;
          padding: 20px;
          background-color: #ffffff;
          border-radius: 8px;
          border: 1px solid #ddd;
        }
        .header {
            background-color: #34495E; /* Grigio Scuro */
            color: #ffffff;
          padding: 20px;
          text-align: center;
          border-radius: 8px 8px 0 0;
        }
        .header img {
            max-width: 150px;
            height: auto;
            margin: 0;
        }
        .header h1 {
          margin: 0;
          font-size: 24px;
          background-color: #34495E; /* Grigio Scuro */
          color: #ffffff;
        }
        .content {
          padding: 20px;
        }
        .content h2 {
          font-size: 18px;
          color: #333;
        }
        .content p {
          font-size: 16px;
          color: #555;
        }
        .button {
          display: inline-block;
          padding: 12px 20px;
          font-size: 16px;
          background-color: #2980B9; /* Blu Acciaio */
          color: #ECF0F1; /* Testo chiaro */
          text-decoration: none;
          border-radius: 4px;
          margin-top: 20px;
          text-align: center;
        }
        .button:hover {
          background-color: #218838;
          cursor: pointer;
        }
        .footer {
          text-align: center;
          padding: 20px;
          font-size: 14px;
          color: #aaa;
        }
      </style>
  </head>
  <body>
    <div class="email-wrapper">
      <div class="header">
        <h1>Reimposta la tua password</h1>
      </div>
      <div class="content">
        <h2>Ciao <%= name %>,</h2>
        <p>Grazie per esserti registratə. Clicca sul bottone qua sotto per reimpostare la tua password:</p>
        <a href="<%= url %>" class="button">Reimposta password</a>
        <p>Se non sei statə tu a inviare la richiesta, per favore ignora questa email.</p>
      </div>
      <div class="footer">
        <p>&copy; <%= currentYear %> Watchly. All rights reserved.</p>
      </div>
    </div>
  </body>
</html>
